# /etc/nginx/sites-available/peeppo.memstroy.app
# then: ln -s /etc/nginx/sites-available/peeppo.memstroy.app /etc/nginx/sites-enabled/
# and get a cert: certbot --nginx -d peeppo.memstroy.app

server {
    listen 80;
    server_name peeppo.memstroy.app;

    # Telegram WebApp requires HTTPS — certbot will add the 443 block + redirect for you.

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /root/peeppo/static/;
    }

    location / {
        root /root/peeppo/webapp;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
