<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Peeppo</title>
<script src="https://telegram.org/js/telegram-web-app.js?58"></script>
<style>
  :root{
    --accent:#8b5cf6;
    --accent2:#facc15;
    --card-bg:#141414;
    --card-border:#262626;
    --danger:#ef4444;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex;
    justify-content:center;
  }
  /* App is always constrained to phone width/height, even on wide desktop screens */
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    min-height:100dvh;
    background:#000;
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  header{
    padding:16px 16px 8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  header{gap:8px;}
  header .brand{font-weight:800; font-size:20px; letter-spacing:.5px; margin-right:auto;}
  header .brand span{color:#fff;}
  header .refs{font-size:12px; color:#888;}
  #gems-pill{
    cursor:pointer;
    height:34px;
    padding:0 10px;
    border-radius:999px;
    background:rgba(250,204,21,.1);
    border:1px solid rgba(250,204,21,.35);
    display:flex; align-items:center; gap:5px;
    color:var(--accent2);
  }
  #gems-pill img{width:16px; height:16px; object-fit:contain;}
  #gems-pill span{font-size:12px; font-weight:800;}
  #gems-pill:active{transform:scale(.94);}
  #invite-btn{
    cursor:pointer;
    height:34px;
    padding:0 12px 0 8px;
    border-radius:999px;
    background:rgba(255,255,255,.06);
    border:1px solid var(--card-border);
    display:flex; align-items:center; gap:5px;
    color:#fff;
  }
  #invite-btn img{width:18px; height:18px; object-fit:contain;}
  #invite-btn span{font-size:11px; font-weight:800; letter-spacing:.3px;}
  #invite-btn:active{transform:scale(.94);}
  main{
    flex:1;
    overflow-y:auto;
    padding:8px 16px 90px;
  }
  .screen{display:none; animation:fade .2s ease;}
  .screen.active{display:block;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- Farm ---------- */
  #farm-screen{
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:calc(100vh - 160px);
    min-height:calc(100dvh - 160px);
    text-align:center;
  }
  #farm-screen.active{display:flex;}
  .farm-stage{
    width:220px; height:220px;
    border-radius:24px;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:28px;
    overflow:hidden;
    position:relative;
  }
  .farm-stage img{
    width:100%; height:100%; object-fit:cover;
    animation:pop .35s ease;
  }
  .farm-stage .placeholder{font-size:48px; opacity:.25;}
  @keyframes pop{from{opacity:0; transform:scale(.7);} to{opacity:1; transform:scale(1);}}
  #farm-result-name{font-size:15px; color:#ccc; min-height:20px;}
  #farm-result-number{font-size:12px; color:var(--accent2); font-weight:700; min-height:16px; margin-bottom:18px;}
  .farm-total-badge{
    font-size:12px; color:#999;
    background:rgba(255,255,255,.05);
    border:1px solid var(--card-border);
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:22px;
  }
  .farm-total-badge b{color:#fff; font-weight:800;}
  #farm-btn{
    border:1px solid rgba(139,92,246,.5);
    padding:18px 56px;
    border-radius:999px;
    font-size:18px;
    font-weight:800;
    letter-spacing:.6px;
    color:#fff;
    background:linear-gradient(160deg,#1c1c1c,#050505);
    box-shadow:0 10px 28px rgba(139,92,246,.3), inset 0 1px 0 rgba(255,255,255,.06);
    cursor:pointer;
  }
  #farm-btn:active{transform:scale(.96);}
  #farm-btn:disabled{opacity:.5;}
  #farm-hint{margin-top:14px; font-size:12px; color:#666;}

  /* ---------- Profile ---------- */
  .profile-card{
    position:relative;
    text-align:center;
    padding:22px 20px 15px;
    margin-bottom:16px;
    background:linear-gradient(160deg,#181818 0%,#0a0a0a 100%);
    border:1px solid var(--card-border);
    border-radius:26px;
    overflow:hidden;
  }
  .profile-card-glow{
    position:absolute; top:-70px; left:50%; transform:translateX(-50%);
    width:220px; height:220px;
    background:radial-gradient(circle, rgba(139,92,246,.35), transparent 70%);
    pointer-events:none;
  }
  .avatar-ring{
    width:66px; height:66px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--accent2),var(--accent));
    padding:3px;
    margin:0 auto 10px;
    position:relative;
  }
  .avatar{
    width:100%; height:100%; border-radius:50%;
    background:#141414;
    border:2px solid #0a0a0a;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:20px;
    overflow:hidden;
  }
  .avatar img{width:100%; height:100%; object-fit:cover;}
  .profile-name{position:relative; font-size:18px; font-weight:800; margin-bottom:2px;}
  .profile-username{position:relative; font-size:12px; font-weight:700; color:var(--accent2); margin-bottom:14px;}
  .profile-stats{position:relative; display:flex; gap:8px;}
  .stat-tile{
    flex:1;
    background:rgba(255,255,255,.045);
    border:1px solid var(--card-border);
    border-radius:14px;
    padding:7px 4px 6px;
  }
  .stat-value{font-size:16px; font-weight:800; line-height:1.1;}
  .stat-label{font-size:10px; color:#777; margin-top:2px; text-transform:uppercase; letter-spacing:.5px;}
  .section-label{
    font-size:12px; font-weight:700; color:#666;
    text-transform:uppercase; letter-spacing:.6px;
    margin:2px 2px 10px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
  }
  .grid-item{
    aspect-ratio:1/1;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:14px;
    position:relative;
    overflow:hidden;
    cursor:pointer;
  }
  .grid-item img{width:100%; height:100%; object-fit:cover;}
  .grid-item .count{
    position:absolute; top:6px; right:6px;
    background:rgba(0,0,0,.7);
    font-size:11px; font-weight:700;
    padding:2px 6px; border-radius:8px;
  }
  .grid-item .drop-number{
    position:absolute; bottom:6px; left:6px;
    background:rgba(0,0,0,.7);
    color:var(--accent2);
    font-size:10px; font-weight:700;
    padding:2px 6px; border-radius:8px;
  }
  .empty-state{
    text-align:center; color:#666; font-size:13px;
    padding:60px 20px;
  }

  /* ---------- Market ---------- */
  #market-screen .empty-state{padding:100px 20px;}
  #market-screen .emoji{font-size:40px; display:block; margin-bottom:10px;}
  #market-sort{
    width:100%; box-sizing:border-box;
    background:var(--card-bg); color:#fff;
    border:1px solid var(--card-border);
    border-radius:12px;
    padding:9px 10px;
    font-size:12px; font-weight:700;
    margin-bottom:10px;
    -webkit-appearance:none; appearance:none;
  }
  .market-item{
    display:flex; align-items:center; gap:12px;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:10px;
    margin-bottom:10px;
  }
  .market-item img{width:56px; height:56px; border-radius:12px; object-fit:cover; flex-shrink:0;}
  .market-item-info{flex:1; min-width:0;}
  .market-item-name{font-weight:700; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .market-item-price{font-size:13px; font-weight:800; color:var(--accent2); margin-top:4px; display:flex; align-items:center; gap:4px;}
  .market-item-price img{width:14px; height:14px; border-radius:0;}
  .market-item-actions{display:flex; flex-direction:column; gap:6px; flex-shrink:0;}
  .market-item-actions button{
    border:none; border-radius:10px; padding:7px 12px; font-size:11px; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .btn-buy{background:var(--accent2); color:#000;}
  .btn-offer{background:rgba(255,255,255,.08); color:#fff; border:1px solid var(--card-border) !important;}
  .btn-unlist{background:rgba(239,68,68,.15); color:var(--danger); border:1px solid rgba(239,68,68,.3) !important;}
  .market-mine-tag{font-size:10px; color:#666; text-transform:uppercase; letter-spacing:.4px;}

  /* ---------- Input modal (buy gems / list price / offer) ---------- */
  #input-overlay{
    position:absolute; inset:0;
    background:rgba(0,0,0,.85);
    display:none;
    align-items:center; justify-content:center;
    z-index:60;
    padding:24px;
  }
  #input-overlay.active{display:flex;}
  #input-card{
    width:100%; max-width:300px;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:20px;
    padding:20px;
    text-align:center;
  }
  #input-title{font-weight:700; margin-bottom:14px;}
  #input-field{
    width:100%; box-sizing:border-box;
    background:#0a0a0a; border:1px solid var(--card-border); border-radius:12px;
    color:#fff; font-size:18px; font-weight:700; text-align:center;
    padding:12px; margin-bottom:14px;
  }
  #input-actions{display:flex; gap:10px;}
  #input-actions button{flex:1; padding:12px; border-radius:12px; border:none; font-weight:700; font-size:13px; cursor:pointer;}
  #input-cancel{background:#1f1f1f; color:#999;}
  #input-confirm{background:var(--accent); color:#fff;}

  /* ---------- Bottom nav ---------- */
  nav{
    position:absolute; left:0; right:0; bottom:0;
    display:flex;
    background:#0a0a0a;
    border-top:1px solid #1f1f1f;
    padding:10px 8px calc(10px + env(safe-area-inset-bottom));
  }
  nav button{
    flex:1;
    background:none; border:none; color:#666;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    font-size:11px;
    padding:6px 0;
    cursor:pointer;
  }
  nav button .icon-img{
    width:26px; height:26px; object-fit:contain;
    opacity:.5; filter:grayscale(100%);
    transition:opacity .15s, filter .15s;
  }
  nav button.active{color:#fff;}
  nav button.active .icon-img{
    opacity:1; filter:grayscale(0%) drop-shadow(0 0 6px rgba(139,92,246,.6));
  }

  /* ---------- Modal ---------- */
  #modal-overlay{
    position:absolute; inset:0;
    background:rgba(0,0,0,.85);
    display:none;
    align-items:center; justify-content:center;
    z-index:50;
    padding:24px;
  }
  #modal-overlay.active{display:flex;}
  #modal-card{
    width:100%; max-width:320px;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:20px;
    padding:18px;
    text-align:center;
  }
  #modal-card img{width:100%; border-radius:14px; margin-bottom:12px; aspect-ratio:1/1; object-fit:cover;}
  #modal-card .modal-name{font-weight:700; margin-bottom:2px;}
  #modal-card .modal-count{font-size:12px; color:#888; margin-bottom:16px;}
  .modal-actions{display:flex; flex-direction:column; gap:10px;}
  .modal-actions-row{display:flex; gap:10px;}
  .modal-actions button{
    flex:1; padding:12px; border-radius:12px; border:none; font-weight:700; font-size:13px; cursor:pointer;
  }
  .btn-share{background:var(--accent); color:#fff;}
  .btn-give{background:var(--accent2); color:#000;}
  .btn-sell{background:#1f1f1f; color:#666; width:100%;}
  .btn-sell.active{background:rgba(139,92,246,.18); color:var(--accent); cursor:pointer;}
  .btn-sell.listed{background:rgba(239,68,68,.15); color:var(--danger); cursor:pointer;}
  .btn-close{
    position:absolute; top:10px; right:10px;
    background:none; border:none; color:#888; font-size:22px; cursor:pointer;
  }
  #toast{
    position:absolute; left:50%; bottom:100px; transform:translateX(-50%) translateY(6px);
    max-width:78%;
    background:rgba(24,24,24,.96);
    backdrop-filter:blur(6px);
    border:1px solid var(--card-border);
    color:#fff; padding:12px 18px; border-radius:16px;
    font-size:13px; font-weight:600; line-height:1.35; text-align:center;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
    opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">PEEP<span>PO</span></div>
    <button id="gems-pill" title="Купить гемы"><img src="/static/icons/diamond.png" alt=""><span id="gems-amount">0</span></button>
    <button id="invite-btn" title="Позвать друзей"><img src="/static/icons/share.png" alt=""><span>ПОДЕЛИТЬСЯ</span></button>
  </header>

  <main>
    <!-- FARM -->
    <section id="farm-screen" class="screen">
      <div class="farm-total-badge">Сфармлено карточек всего: <b id="total-farmed">0</b></div>
      <div class="farm-stage" id="farm-stage"><div class="placeholder">🎁</div></div>
      <div id="farm-result-name"></div>
      <div id="farm-result-number"></div>
      <button id="farm-btn">ФАРМ</button>
      <div id="farm-hint">Жми и получай случайную карточку</div>
    </section>

    <!-- MARKET -->
    <section id="market-screen" class="screen">
      <select id="market-sort">
        <option value="price_asc" selected>Цена: сначала дешёвые</option>
        <option value="price_desc">Цена: сначала дорогие</option>
        <option value="new">Сначала новые</option>
        <option value="old">Сначала старые</option>
        <option value="name">По названию (А-Я)</option>
      </select>
      <div id="market-list"></div>
    </section>

    <!-- PROFILE -->
    <section id="profile-screen" class="screen">
      <div class="profile-card">
        <div class="profile-card-glow"></div>
        <div class="avatar-ring"><div class="avatar" id="profile-avatar">?</div></div>
        <div class="profile-name" id="profile-name">...</div>
        <div class="profile-username" id="profile-username"></div>
        <div class="profile-stats">
          <div class="stat-tile">
            <div class="stat-value" id="stat-total">0</div>
            <div class="stat-label">Карты</div>
          </div>
          <div class="stat-tile">
            <div class="stat-value" id="stat-refs">0</div>
            <div class="stat-label">Рефералы</div>
          </div>
        </div>
      </div>
      <div class="section-label">Коллекция</div>
      <div class="grid" id="profile-grid"></div>
    </section>
  </main>

  <nav>
    <button class="nav-btn active" data-screen="farm-screen"><img class="icon-img" src="/static/icons/farm.png" alt="">Фарм</button>
    <button class="nav-btn" data-screen="market-screen"><img class="icon-img" src="/static/icons/cage.png" alt="">Рынок</button>
    <button class="nav-btn" data-screen="profile-screen"><img class="icon-img" src="/static/icons/profile_red.png" alt="">Профиль</button>
  </nav>

  <div id="modal-overlay">
    <div id="modal-card">
      <button class="btn-close" id="modal-close">✕</button>
      <img id="modal-img" src="" alt="">
      <div class="modal-name" id="modal-name"></div>
      <div class="modal-count" id="modal-count"></div>
      <div class="modal-actions">
        <div class="modal-actions-row">
          <button class="btn-share" id="modal-share">Поделиться</button>
          <button class="btn-give" id="modal-give">Передать</button>
        </div>
        <button class="btn-sell" id="modal-sell">Продать</button>
      </div>
    </div>
  </div>

  <div id="input-overlay">
    <div id="input-card">
      <div id="input-title">Введи число</div>
      <input id="input-field" type="number" inputmode="numeric" min="1" placeholder="0">
      <div id="input-actions">
        <button id="input-cancel">Отмена</button>
        <button id="input-confirm">ОК</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const API_BASE = "/api";
let initData = tg?.initData || "";
let inventory = [];
let selectedUserCardId = null;
let selectedItem = null;

function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(()=>el.classList.remove("show"), 3000);
}

// ---------- Generic input modal (buy gems / list price / offer / gift username) ----------
let inputResolve = null;
let inputNumeric = true;
function promptInput(title, {numeric=true, placeholder=""}={}){
  return new Promise(resolve=>{
    inputResolve = resolve;
    inputNumeric = numeric;
    document.getElementById("input-title").textContent = title;
    const field = document.getElementById("input-field");
    field.type = numeric ? "number" : "text";
    field.setAttribute("inputmode", numeric ? "numeric" : "text");
    field.placeholder = placeholder;
    field.value = "";
    document.getElementById("input-overlay").classList.add("active");
    setTimeout(()=>field.focus(), 50);
  });
}
function promptNumber(title){
  return promptInput(title, { numeric: true });
}
function promptText(title, placeholder=""){
  return promptInput(title, { numeric: false, placeholder });
}
function closeInputModal(value){
  document.getElementById("input-overlay").classList.remove("active");
  if(inputResolve) inputResolve(value);
  inputResolve = null;
}
document.getElementById("input-cancel").addEventListener("click", ()=>closeInputModal(null));
document.getElementById("input-confirm").addEventListener("click", ()=>{
  const field = document.getElementById("input-field");
  if(inputNumeric){
    const val = parseInt(field.value, 10);
    closeInputModal(Number.isFinite(val) && val > 0 ? val : null);
  }else{
    const val = field.value.trim().replace(/^@/, "");
    closeInputModal(val ? val : null);
  }
});

async function api(path, body={}){
  const res = await fetch(API_BASE + path, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ initData, ...body })
  });
  if(!res.ok){
    const detail = await res.text();
    throw new Error(detail || res.statusText);
  }
  return res.json();
}

// ---------- Navigation ----------
document.querySelectorAll(".nav-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
    btn.classList.add("active");
    const screen = document.getElementById(btn.dataset.screen);
    screen.classList.add("active");
    if(btn.dataset.screen === "profile-screen") loadProfile();
    if(btn.dataset.screen === "market-screen") loadMarket();
  });
});
document.getElementById("farm-screen").classList.add("active");

// ---------- Farm ----------
async function loadStats(){
  try{
    const res = await fetch(API_BASE + "/stats");
    const data = await res.json();
    document.getElementById("total-farmed").textContent = data.total_farmed;
  }catch(e){ /* non-critical, just skip */ }
}
loadStats();

// ---------- Gems ----------
async function refreshGems(){
  try{
    const auth = await api("/auth");
    document.getElementById("gems-amount").textContent = auth.gems;
  }catch(e){ /* non-critical */ }
}
refreshGems();

document.getElementById("gems-pill").addEventListener("click", async ()=>{
  const gems = await promptNumber("Сколько гемов купить? (1 гем = 1 ⭐)");
  if(!gems) return;
  try{
    const res = await api("/gems/invoice", { gems });
    if(tg?.openInvoice){
      tg.openInvoice(res.invoice_link, (status)=>{
        if(status === "paid"){
          toast("Оплачено! Зачисляем гемы...");
          setTimeout(refreshGems, 1500);
        }else if(status === "failed"){
          toast("Платёж не прошёл");
        }
      });
    }else{
      window.open(res.invoice_link, "_blank");
      toast("Открой ссылку оплаты и вернись сюда");
    }
  }catch(e){
    toast("Не удалось создать счёт: " + e.message);
  }
});

// ---------- Market ----------
let marketListings = [];

async function loadMarket(){
  try{
    const data = await api("/market/listings");
    document.getElementById("gems-amount").textContent = data.gems;
    marketListings = data.listings;
    renderMarket();
  }catch(e){
    toast("Не удалось загрузить рынок: " + e.message);
  }
}

document.getElementById("market-sort").addEventListener("change", renderMarket);

function renderMarket(){
  const list = document.getElementById("market-list");
  if(marketListings.length === 0){
    list.innerHTML = `<div class="empty-state"><span class="emoji">🛒</span>Пока никто ничего не продаёт.<br>Выстави свою картинку в профиле!</div>`;
    return;
  }

  const sortMode = document.getElementById("market-sort").value;
  const sorted = [...marketListings].sort((a, b) => {
    switch(sortMode){
      case "old": return a.user_card_id - b.user_card_id;
      case "new": return b.user_card_id - a.user_card_id;
      case "price_desc": return b.listed_price - a.listed_price;
      case "name": return (a.name || "").localeCompare(b.name || "", "ru");
      case "price_asc":
      default: return a.listed_price - b.listed_price;
    }
  });

  list.innerHTML = sorted.map(l => `
      <div class="market-item" data-uc="${l.user_card_id}">
        <img src="/static/cards/${l.filename}" alt="${l.name||''}">
        <div class="market-item-info">
          <div class="market-item-name">${l.name || "Без названия"}</div>
          <div class="market-item-price"><img src="/static/icons/diamond.png" alt="">${l.listed_price}</div>
        </div>
        <div class="market-item-actions">
          ${l.is_mine
            ? `<div class="market-mine-tag">Твой лот</div><button class="btn-unlist" data-action="unlist">Снять</button>`
            : `<button class="btn-buy" data-action="buy">Купить</button><button class="btn-offer" data-action="offer">Оценить</button>`}
        </div>
      </div>
    `).join("");

    list.querySelectorAll(".market-item").forEach(el=>{
      const ucId = parseInt(el.dataset.uc);
      el.querySelector('[data-action="buy"]')?.addEventListener("click", async ()=>{
        try{
          await api("/market/buy", { user_card_id: ucId });
          toast("Куплено! Смотри в профиле.");
          loadMarket();
          refreshGems();
        }catch(e){ toast("Не получилось купить: " + e.message); }
      });
      el.querySelector('[data-action="offer"]')?.addEventListener("click", async ()=>{
        const price = await promptNumber("Сколько гемов предложить?");
        if(!price) return;
        try{
          await api("/market/offer", { user_card_id: ucId, price_gems: price });
          toast("Предложение отправлено продавцу");
        }catch(e){ toast("Не получилось: " + e.message); }
      });
      el.querySelector('[data-action="unlist"]')?.addEventListener("click", async ()=>{
        try{
          await api("/market/unlist", { user_card_id: ucId });
          toast("Снято с продажи");
          loadMarket();
        }catch(e){ toast("Не получилось: " + e.message); }
      });
    });
}

document.getElementById("farm-btn").addEventListener("click", async ()=>{
  const btn = document.getElementById("farm-btn");
  btn.disabled = true;
  try{
    const card = await api("/farm");
    const stage = document.getElementById("farm-stage");
    stage.innerHTML = `<img src="/static/cards/${card.filename}" alt="${card.name||''}">`;
    document.getElementById("farm-result-name").textContent = card.name || "Новая картинка!";
    document.getElementById("farm-result-number").textContent = `№${card.farm_number}`;
    document.getElementById("total-farmed").textContent = card.total_farmed;
    tg?.HapticFeedback?.notificationOccurred("success");
  }catch(e){
    toast("Ошибка фарма: " + e.message);
  }finally{
    btn.disabled = false;
  }
});

// ---------- Profile ----------
async function loadProfile(){
  try{
    const auth = await api("/auth");
    document.getElementById("profile-name").textContent = auth.first_name || auth.username || "Игрок";
    document.getElementById("profile-username").textContent = auth.username ? `@${auth.username}` : "";
    const avatarEl = document.getElementById("profile-avatar");
    if(auth.photo_url){
      avatarEl.innerHTML = `<img src="${auth.photo_url}" alt="">`;
    }else{
      avatarEl.textContent = (auth.first_name||auth.username||"?")[0].toUpperCase();
    }
    document.getElementById("stat-refs").textContent = auth.referrals || 0;
    document.getElementById("gems-amount").textContent = auth.gems || 0;

    const data = await api("/profile");
    inventory = data.inventory;
    const total = inventory.reduce((s,c)=>s+c.count, 0);
    document.getElementById("stat-total").textContent = total;

    const grid = document.getElementById("profile-grid");
    if(inventory.length === 0){
      grid.innerHTML = "";
      grid.insertAdjacentHTML("afterend", `<div class="empty-state" id="empty-hint">Пока пусто — иди фармить 🌱</div>`);
      return;
    }
    document.getElementById("empty-hint")?.remove();
    grid.innerHTML = inventory.map(c => `
      <div class="grid-item" data-card-id="${c.card_id}">
        <img src="/static/cards/${c.filename}" alt="${c.name||''}">
        <div class="drop-number">#${c.user_card_id}</div>
        ${c.count > 1 ? `<div class="count">x${c.count}</div>` : ""}
      </div>
    `).join("");

    grid.querySelectorAll(".grid-item").forEach(el=>{
      el.addEventListener("click", ()=>openModal(parseInt(el.dataset.cardId)));
    });
  }catch(e){
    toast("Не удалось загрузить профиль: " + e.message);
  }
}

function openModal(cardId){
  const item = inventory.find(c => c.card_id === cardId);
  if(!item) return;
  // database.get_inventory() includes one real user_cards.id per card group (the most
  // recently obtained copy) specifically so the modal can share a concrete owned row.
  selectedUserCardId = item.user_card_id;
  selectedItem = item;
  document.getElementById("modal-img").src = `/static/cards/${item.filename}`;
  document.getElementById("modal-name").textContent = `${item.name || "Без названия"} #${item.user_card_id}`;
  document.getElementById("modal-count").textContent = `У тебя: ${item.count}`;
  document.getElementById("modal-overlay").classList.add("active");
  document.getElementById("modal-card").dataset.filename = item.filename;
  updateSellButton(item);
}

function updateSellButton(item){
  const btn = document.getElementById("modal-sell");
  btn.classList.remove("active", "listed");
  if(item.listed_price){
    btn.textContent = `Убрать с продажи (${item.listed_price} 💎)`;
    btn.classList.add("listed");
  }else{
    btn.textContent = "Продать";
    btn.classList.add("active");
  }
}

document.getElementById("modal-close").addEventListener("click", ()=>{
  document.getElementById("modal-overlay").classList.remove("active");
});

document.getElementById("modal-share").addEventListener("click", async ()=>{
  try{
    await api("/share", { user_card_id: selectedUserCardId });
    toast("Отправлено в чат с ботом — перешли друзьям! 🎉");
    document.getElementById("modal-overlay").classList.remove("active");
  }catch(e){
    toast("Не удалось поделиться: " + e.message);
  }
});

document.getElementById("modal-give").addEventListener("click", async ()=>{
  const username = await promptText("Username друга (без @)", "username");
  if(!username) return;
  try{
    const res = await api("/transfer/to_username", { user_card_id: selectedUserCardId, username });
    toast(`Подарено пользователю @${res.to_name}!`);
    document.getElementById("modal-overlay").classList.remove("active");
    loadProfile();
  }catch(e){
    toast("Не удалось передать: " + e.message);
  }
});

document.getElementById("modal-sell").addEventListener("click", async ()=>{
  if(!selectedItem) return;
  if(selectedItem.listed_price){
    try{
      await api("/market/unlist", { user_card_id: selectedUserCardId });
      selectedItem.listed_price = null;
      updateSellButton(selectedItem);
      toast("Снято с продажи");
    }catch(e){
      toast("Не получилось: " + e.message);
    }
  }else{
    const price = await promptNumber("Цена в гемах");
    if(!price) return;
    try{
      await api("/market/list", { user_card_id: selectedUserCardId, price_gems: price });
      selectedItem.listed_price = price;
      updateSellButton(selectedItem);
      toast("Выставлено на рынок!");
    }catch(e){
      toast("Не получилось выставить: " + e.message);
    }
  }
});

// ---------- Invite friends (header button, visible on every tab) ----------
function openShareSheet(url, text){
  const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`;
  if(tg?.openTelegramLink){
    tg.openTelegramLink(shareUrl);
  }else{
    window.open(shareUrl, "_blank");
  }
}

document.getElementById("invite-btn").addEventListener("click", ()=>{
  const myId = tg?.initDataUnsafe?.user?.id;
  if(!myId){
    toast("Открой через Телеграм, чтобы поделиться");
    return;
  }
  const refLink = `https://t.me/Peeppobot?start=ref${myId}`;
  openShareSheet(refLink, "Залетай в Peeppo — фарми картинки, собирай коллекцию! 🎮");
});

// initial load
loadProfile();
</script>
</body>
</html>
